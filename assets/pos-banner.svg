<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .terminal-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-wave {
      animation: dash 12s linear infinite;
    }
    .badge-float {
      animation: float 6s ease-in-out infinite alternate;
    }
    .badge-float-delayed {
      animation: float 6s ease-in-out infinite alternate;
      animation-delay: -3s;
    }
    .card-hover {
      animation: cardPulse 5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes cardPulse {
      0% { transform: translateY(0px); stroke-opacity: 0.4; }
      100% { transform: translateY(-4px); stroke-opacity: 0.9; }
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Ambient Glow Spots in Background -->
  <g class="terminal-pulse">
    <circle cx="150" cy="180" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)" />
    <circle cx="1050" cy="180" r="160" fill="#7c3aed" opacity="0.18" filter="url(#glow)" />
    <circle cx="600" cy="20" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Animated Data Streams / Connecting Mesh (Background Layer) -->
  <g fill="none" opacity="0.6">
    <path class="flow-wave" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="8 8" 
          d="M 50,300 C 300,320 400,240 600,250 S 900,330 1150,280" />
    <path class="flow-wave" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"
          d="M 80,60 C 350,30 500,120 750,80 S 1000,40 1120,90" />
    <path class="flow-wave" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"
          d="M 120,330 C 400,280 650,350 900,310 S 1050,340 1180,310" />
  </g>

  <!-- Decorative POS Terminal Silhouette Illustration (Right Background) -->
  <g transform="translate(930, 75)" opacity="0.75" class="badge-float-delayed">
    <!-- Terminal Screen Base -->
    <rect x="0" y="0" width="180" height="120" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- Screen Header -->
    <rect x="10" y="10" width="160" height="20" rx="4" fill="#1e293b" />
    <circle cx="22" cy="20" r="3.5" fill="#ef4444" />
    <circle cx="34" cy="20" r="3.5" fill="#f59e0b" />
    <circle cx="46" cy="20" r="3.5" fill="#10b981" />
    <!-- Screen Content Simulation -->
    <rect x="15" y="42" width="70" height="8" rx="2" fill="#38bdf8" opacity="0.8" />
    <rect x="15" y="56" width="110" height="6" rx="2" fill="#64748b" opacity="0.6" />
    <rect x="15" y="68" width="90" height="6" rx="2" fill="#64748b" opacity="0.6" />
    <rect x="15" y="80" width="50" height="6" rx="2" fill="#64748b" opacity="0.6" />
    <!-- Total Pill -->
    <rect x="100" y="78" width="65" height="24" rx="6" fill="#10b981" opacity="0.25" stroke="#10b981" stroke-width="1" />
    <text x="132" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">$142.50</text>
    <!-- Stand -->
    <path d="M 70 120 L 60 160 L 120 160 L 110 120 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="40" y="158" width="100" height="8" rx="4" fill="#334155" />
    <!-- Receipt Printer Paper Flow -->
    <path class="flow-wave" d="M 140 135 L 140 185" stroke="#94a3b8" stroke-width="18" stroke-dasharray="3 3" opacity="0.25" />
  </g>

  <!-- Decorative Cash / Card Pill (Left Background) -->
  <g transform="translate(70, 80)" opacity="0.7" class="badge-float">
    <rect x="0" y="0" width="160" height="100" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    <rect x="15" y="20" width="32" height="24" rx="4" fill="#f59e0b" opacity="0.8" />
    <line x1="15" y1="65" x2="105" y2="65" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="15" y1="78" x2="65" y2="78" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <circle cx="130" cy="72" r="14" fill="#ef4444" opacity="0.5" />
    <circle cx="142" cy="72" r="14" fill="#f59e0b" opacity="0.5" />
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges (Crisp, High Contrast, Guaranteed Legible) -->

  <!-- Awesome Tag Badge -->
  <g transform="translate(600, 70)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#softGlow)" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      ⚡ AWESOME POINT OF SALE ⚡
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 145)">
    <!-- Shadow for ultra clarity -->
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#000000" text-anchor="middle" opacity="0.75" letter-spacing="-0.5">
      Awesome Point of Sale (POS) Software
    </text>
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-0.5">
      Awesome Point of Sale (POS) Software
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 192)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.2">
      Curated Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Systems
    </text>
  </g>

  <!-- Secondary Tagline -->
  <g transform="translate(600, 222)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Retail Stores • Restaurants &amp; Hospitality • Omnichannel Commerce • Offline-First Cashier Desks
    </text>
  </g>

  <!-- Interactive Category Badges (Pills) -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <text x="72" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">
        ☁️ SaaS &amp; Cloud
      </text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
      <text x="72" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">
        🔓 Open-Source
      </text>
    </g>

    <!-- Pill 3: ERP Integration -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="155" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <text x="77" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe" text-anchor="middle">
        🔄 ERP Integrated
      </text>
    </g>

    <!-- Pill 4: Offline First -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.9" />
      <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">
        ⚡ Offline-First
      </text>
    </g>
  </g>

  <!-- Bottom Accent Highlight Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
